<html lang="en">
<head>

    <title>Todolist</title>
</head>
<body>
    <h1>To Do List</h1>
    <input type="text"
        id="taskInput"
        placeholder="Add a task"

    />
    <button onclick="addTask()">Add</button>

<script>
    function addTask(){
        getTaskText();
    }

    function getTaskText(){
        var input = document.getElementById('taskInput');
         console.log(input.value);
    }
    </script>    
</body>
